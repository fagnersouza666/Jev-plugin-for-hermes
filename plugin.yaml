name: jev-plugin-for-hermes
version: 0.3.0
manifest_version: 2
api_version: 1
kind: standalone
description: "TypeSafe Jev decision primitives exposed as Hermes tools and a namespaced skill."
author: Fagner Souza
license: MIT
tags:
  - decision
  - classification
  - typesafe
  - jev
requires_env:
  - name: TYPESAFE_API_KEY
    description: "API key for the TypeSafe Jev API"
    url: "https://console.typesafe.ai"
    secret: true
provides_tools:
  - jev_evaluate
  - jev_price_assess
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_tool_call
  - transform_tool_result
config_schema:
  api_url:
    type: str
    default: "https://api.typesafe.ai/v1/systemone"
    description: "TypeSafe System One endpoint"
  default_model:
    type: str
    default: "jev-latest"
    description: "Jev model alias or pinned version"
  timeout_seconds:
    type: float
    default: 30.0
    description: "Per-request timeout"
  max_state_chars:
    type: int
    default: 20000
    description: "Maximum serialized state size sent to Jev"
  pre_tool_guard_enabled:
    type: bool
    default: false
    description: "Opt in to fail-closed Jev assessment before every Hermes tool call"
  skills_mode:
    type: str
    default: "off"
    description: "Skill routing: off, observe, suggest"
  tools_mode:
    type: str
    default: "off"
    description: "Function schema routing: off, observe, filter"
  results_mode:
    type: str
    default: "off"
    description: "Search result routing: off, observe, filter"
  profiles_mode:
    type: str
    default: "off"
    description: "Profile routing: off, observe, suggest"
  recovery_mode:
    type: str
    default: "off"
    description: "Recovery advice: off, observe, suggest"
  skills_catalog:
    type: list
    default: []
    description: "Up to 255 available skills: id, description, optional details; no file discovery"
  profiles_catalog:
    type: list
    default: []
    description: "Up to 254 available profiles: id, description, optional details; reserves keep-current option"
  essential_tools:
    type: list
    default: []
    description: "Exact tool names that filtering must always preserve"
  routing_budget_seconds:
    type: float
    default: 25.0
    description: "Shared Jev evaluation budget per turn, clamped 1–25 seconds"
  routing_threshold:
    type: float
    default: 0.7
    description: "Relevance/applicability threshold, clamped 0–1; calibrate before filtering"
