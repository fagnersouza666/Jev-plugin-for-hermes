[project]
name = "jev-plugin-for-hermes"
version = "0.1.0"
description = "Standalone Hermes Agent plugin for TypeSafe Jev decision primitives"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fagner Souza" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
ignore = ["N999"]
